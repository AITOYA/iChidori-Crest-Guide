site_name: iChidori-Crest
site_description: Configuration & Getting Started Guide for iChidori-Crest HAT — Raspberry Pi HAT with Septentrio mosaic-G5 GNSS and LTE mPCIe
site_author: Aitoya Works
site_url: https://aitoya.github.io/iChidori-Crest-Guide/
repo_url: https://github.com/AITOYA/iChidori-Crest-Guide
docs_dir: docs

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
  logo: images/logo.png
  favicon: images/favicon.png

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

extra_javascript:
  - https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js

nav:
  - Home: index.md
  - Hardware Reference:
    - Overview: hardware-reference/overview.md
    - Interfaces: hardware-reference/interfaces.md
    - Specifications: hardware-reference/specifications.md
  - Getting Started:
    - Basic Setup: getting-started/basic-setup.md
    - SD Logging: getting-started/sd-logging.md
    - Raspberry Pi Connection: getting-started/pi-connect.md
    - LTE Setup: getting-started/lte-setup.md
    - Remote Access (Tailscale): getting-started/remote-access.md
  - Application Examples:
    - CLAS-MADOCA: application-examples/clas-madoca.md
    #- GNSS Data Logger: application-examples/data-logger.md
    #- LTE Sleep Mode: application-examples/lte-sleep.md
    #- Two-Pi Relay: application-examples/two-pi-relay.md
  - Troubleshooting: troubleshooting.md

extra_css:
  - stylesheets/extra.css